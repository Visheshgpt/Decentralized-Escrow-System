name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npx hardhat compile
      - run: npx hardhat test
      - run: REPORT_GAS=true npx hardhat test > gas-report.txt
      - run: npx hardhat coverage
      - name: Coverage gate
        run: |
          COVERAGE=$(cat coverage/lcov.info | grep -o 'LF:[0-9]*' | awk -F: '{s+=$2} END {print s}')
          echo "Checking coverage threshold..."
  size-check:
    runs-on: ubuntu-latest
    steps:
      - run: npx hardhat size-contracts
        # Fails if any contract exceeds 24KB EIP-170 limit    
  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install slither-analyzer
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npx hardhat compile
      - name: Run Slither
        run: |
          slither . \
            --hardhat-artifacts-directory artifacts \
            --exclude naming-convention \
            --sarif results.sarif \
            --json slither-report.json
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif